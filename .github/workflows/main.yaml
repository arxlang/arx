name: main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POETRY_INSTALLER_PARALLEL: "false"
  VIRTUALENV_ACTIVATORS: "bash,python"

jobs:
  check-branch:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-branch-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if the PR's branch is updated
        uses: osl-incubator/gh-check-pr-is-updated@1.0.0
        with:
          remote_branch: origin/main
          pr_sha: ${{ github.event.pull_request.head.sha }}

  package-tests:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project:
          - arx
          - astx
          - irx
          - arxpy
          - aix
          - arxjit
        python_version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        os:
          - "ubuntu"
          # - "macos"
          # - "windows"
    runs-on: ${{ matrix.os }}-latest
    concurrency:
      group: ci-package-tests-${{ matrix.project }}-${{ matrix.os }}-${{ matrix.python_version }}-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          environment-file: conda/dev.yaml
          channels: conda-forge,nodefaults
          activate-environment: arx
          auto-update-conda: true
          conda-solver: libmamba
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        run: |
          poetry check
          # Finish tool dependency updates before building local packages.
          poetry install --no-directory
          poetry install

      - name: Require native integration prerequisites
        if: matrix.project == 'arx' || matrix.project == 'irx'
        run: python scripts/check_native_test_environment.py

      - name: Run package unit tests
        run: makim ${{ matrix.project }}.unittests

  arx-language-tests:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        os:
          - "ubuntu"
          # - "macos"
          # - "windows"
    runs-on: ${{ matrix.os }}-latest
    concurrency:
      group: ci-arx-language-tests-${{ matrix.os }}-${{ matrix.python_version }}-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          environment-file: conda/dev.yaml
          channels: conda-forge,nodefaults
          activate-environment: arx
          auto-update-conda: true
          conda-solver: libmamba
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        run: |
          poetry check
          # Finish tool dependency updates before building local packages.
          poetry install --no-directory
          poetry install

      - name: Require native integration prerequisites
        run: python scripts/check_native_test_environment.py

      - name: Run compiled Arx tests
        run: makim arx.test-compiled

      - name: Run Arx smoke tests
        run: makim arx.test-smoke

      - name: Run Arx syntax manifest checks
        run: makim arx.check-syntax

      - name: Run compiled AIX tests
        run: makim aix.test-compiled

      - name: Run AIX syntax manifest checks
        run: makim aix.check-syntax

  wheel-smoke:
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash -l {0}

    concurrency:
      group: ci-wheel-smoke-${{ matrix.python_version }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          environment-file: conda/dev.yaml
          channels: conda-forge,nodefaults
          activate-environment: arx
          auto-update-conda: true
          conda-solver: libmamba
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        run: |
          poetry check
          # Finish tool dependency updates before building local packages.
          poetry install --no-directory
          poetry install

      - name: Build and test installed package artifacts
        run: makim all.wheel-smoke

  linter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash -l {0}

    concurrency:
      group: ci-linter-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          environment-file: conda/dev.yaml
          channels: conda-forge,nodefaults
          activate-environment: arx
          auto-update-conda: true
          conda-solver: libmamba
          python-version: "3.10"

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          # Finish tool dependency updates before building local packages.
          poetry install --no-directory
          poetry install

      - name: Run style checks
        if: success() || failure()
        run: |
          pre-commit install
          makim all.lint

      - name: Setup tmate session
        if: "${{ failure() && (contains(github.event.pull_request.labels.*.name, 'ci:enable-debugging')) }}"
        uses: mxschmitt/action-tmate@v3

  native-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ci-native-sanitizers-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          environment-file: conda/dev.yaml
          channels: conda-forge,nodefaults
          activate-environment: arx
          auto-update-conda: true
          conda-solver: libmamba
          python-version: "3.14"
      - name: Install dependencies
        run: |
          # Finish tool dependency updates before building local packages.
          poetry install --no-directory
          poetry install
      - name: Install system sanitizer toolchain
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Check native prerequisites
        run: python scripts/check_native_test_environment.py
      - name: Exercise native ownership, kernels and Parquet with sanitizers
        env:
          SANITIZER_CC: /usr/bin/clang
          SANITIZER_CXX: /usr/bin/clang++
        run: makim irx.test-sanitizers

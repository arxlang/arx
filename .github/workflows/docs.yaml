name: Documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  POETRY_INSTALLER_PARALLEL: "false"
  VIRTUALENV_ACTIVATORS: "bash,python"

jobs:
  release:
    runs-on: ubuntu-latest
    # Covers environment setup plus native API extraction and site rendering.
    timeout-minutes: 30

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: conda/dev.yaml
          channels: conda-forge,nodefaults
          activate-environment: arx
          auto-update-conda: true
          conda-solver: libmamba
          python-version: "3.11"

      - name: Install deps
        run: |
          poetry config virtualenvs.create false
          # Finish tool dependency updates before building local packages.
          poetry install --no-directory
          poetry install

      - name: Generate documentation
        id: docs
        # Temporary until DoukiMD supports cross-source decorator re-exports.
        # Other errors remain blocking; failed builds must not be published.
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/doukimd-build.log"
          known_error='Error: \[api\] Unresolved re-export: (irx|arxpy)\.typecheck\.typechecked'
          if makim docs.build 2>&1 | tee "$log_file"; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          elif grep -Exq "$known_error" "$log_file" &&
            ! grep -Exv "$known_error" "$log_file" | grep '^Error:'; then
            echo "::warning::Skipping documentation: known DoukiMD cross-source re-export limitation."
          else
            exit 1
          fi

      - name: GitHub Pages action
        if: ${{ github.event_name == 'workflow_dispatch' && steps.docs.outputs.built == 'true' }}
        uses: peaceiris/actions-gh-pages@v3.5.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/

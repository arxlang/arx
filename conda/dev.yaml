name: arx
channels:
  - nodefaults
  - conda-forge
dependencies:
  - clang 14.*
  - clangdev 14.*
  - graphviz
  - pip
  - poetry >=1.5
  - python >=3.11,<3.15
  - nodejs >=24.10,<25 # used by semantic-release
  - shellcheck
  - pip
  - pip:
      # fix issues with distlib
      - paginate
      - pyrepl
